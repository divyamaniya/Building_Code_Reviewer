[project]
name = "obc-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling[asr,easyocr,rapidocr,tesserocr,vlm]>=2.46.0",
    "dvc>=3.67.1",
    "hydra-core>=1.3.2",
    "llama-index>=0.14.10",
    "llama-index-core>=0.14.10",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-llms-huggingface>=0.6.1",
    "llama-index-llms-ollama>=0.9.1",
    "llama-index-readers-docling>=0.4.2",
    "llama-index-readers-file>=0.5.6",
    "llama-index-vector-stores-chroma>=0.5.5",
    "markupsafe==2.1.5",
    "mlflow>=3.10.1",
    "onnxruntime>=1.23.2",
    "pathlib>=1.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rapidocr>=3.4.5",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
